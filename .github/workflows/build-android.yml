name: Build Android (APK & AAB)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon -Pandroid.useAndroidX=true

      - name: Sign AAB (if tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            # Accept either the raw Base64 value or the named value copied from our secret file.
            KEYSTORE_B64='${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
            KEYSTORE_B64="$(printf '%s\n' "$KEYSTORE_B64" | awk 'NF { value=$0 } END { print value }')"
            KEYSTORE_B64="${KEYSTORE_B64#ANDROID_KEYSTORE_BASE64=}"
            printf '%s' "$KEYSTORE_B64" | base64 --decode --ignore-garbage > release.keystore
            STORE_PASS="$(printf '%s\n' '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' | awk 'NF { value=$0 } END { print value }')"
            STORE_PASS="${STORE_PASS#ANDROID_KEYSTORE_PASSWORD=}"
            KEY_ALIAS="$(printf '%s\n' '${{ secrets.ANDROID_KEY_ALIAS }}' | awk 'NF { value=$0 } END { print value }')"
            KEY_ALIAS="${KEY_ALIAS#ANDROID_KEY_ALIAS=}"
            KEY_PASS="$(printf '%s\n' '${{ secrets.ANDROID_KEY_PASSWORD }}' | awk 'NF { value=$0 } END { print value }')"
            KEY_PASS="${KEY_PASS#ANDROID_KEY_PASSWORD=}"
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              "-Pandroid.injected.signing.store.password=$STORE_PASS" \
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
              "-Pandroid.injected.signing.key.password=$KEY_PASS"
          else
            echo "No signing secrets found — skipping signing step"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nour-app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nour-app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: نور ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false

  ota:
    name: Publish OTA bundle to Capgo
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies and build web bundle
        run: npm ci && npm run build

      - name: Upload OTA bundle to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "CAPGO_TOKEN is not configured; skipping OTA upload."
            exit 0
          fi
          npx --yes @capgo/cli@latest bundle upload --channel production
